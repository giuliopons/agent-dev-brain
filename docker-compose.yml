# nome fisso del progetto compose: altrimenti dipende dal nome della cartella
name: agent-dev-brain

services:
  agent-dev-brain:
    build:
      context: .
      # uid/gid dell'utente che possiede brain/ e state/: install.sh li scrive in .env
      args:
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    image: agent-dev-brain:latest
    container_name: agent-dev-brain
    env_file: .env
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    # rete dell'host: 127.0.0.1:22 è l'sshd del mini PC (from= in authorized_keys di brain)
    network_mode: host
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - ./brain:/work/brain
      - ./state:/state
      - ./state/claude:/home/agent/.claude
      - ./state/ssh:/home/agent/.ssh:ro
      - ./bot.py:/app/bot.py:ro
      # fusi orari dell'host: la cattura nomina le note nell'ora locale (TZ in .env)
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
